<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.35" />

  <!-- Road perspective -->
  <polygon points="216,130 296,130 380,450 132,450" fill="url(#roadGrad)" />
  
  <!-- Road markings (dashed center line) -->
  <line x1="256" y1="140" x2="256" y2="180" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="210" x2="256" y2="260" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="290" x2="256" y2="350" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="380" x2="256" y2="445" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />

  <!-- Car silhouette / front view -->
  <g transform="translate(186, 270)">
    <!-- Car body base -->
    <path d="M 15 50 C 15 35, 25 25, 45 20 L 95 20 C 115 25, 125 35, 125 50 L 130 75 C 135 80, 138 88, 138 95 L 138 105 C 138 112, 130 115, 120 115 L 20 115 C 10 115, 2 112, 2 105 L 2 95 C 2 88, 5 80, 10 75 Z" fill="#10b981" />
    
    <!-- Windshield -->
    <path d="M 28 45 L 42 24 L 98 24 L 112 45 Z" fill="#0f172a" />
    
    <!-- Headlights -->
    <ellipse cx="22" cy="78" rx="12" ry="7" fill="#fef08a" />
    <ellipse cx="118" cy="78" rx="12" ry="7" fill="#fef08a" />
    
    <!-- Grille & Logo -->
    <rect x="45" y="74" width="50" height="12" rx="4" fill="#047857" />
    <circle cx="70" cy="80" r="5" fill="#f8fafc" />

    <!-- Wheels -->
    <rect x="6" y="105" width="22" height="18" rx="6" fill="#020617" />
    <rect x="112" y="105" width="22" height="18" rx="6" fill="#020617" />
  </g>

  <!-- Location Pin & Target Star at Top -->
  <g transform="translate(256, 110)">
    <circle cx="0" cy="0" r="30" fill="url(#emeraldGrad)" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
  </g>

  <!-- Small compass icon top right -->
  <circle cx="410" cy="95" r="32" fill="#0f172a" stroke="#10b981" stroke-width="4" stroke-opacity="0.8" />
  <polygon points="410,75 418,95 410,91 402,95" fill="#ef4444" />
  <polygon points="410,115 418,95 410,99 402,95" fill="#e2e8f0" />
</svg>
